<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rust Category Detection{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Rust Category Detection home">
        <span class="brand-mark">RC</span>
        <span>Rust Category Detection</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a class="{{ 'active' if active_page == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
        <a class="{{ 'active' if active_page == 'detection' else '' }}" href="{{ url_for('detection') }}">Detection</a>
        <a class="{{ 'active' if active_page == 'about' else '' }}" href="{{ url_for('about') }}">About</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>YOLO11 OBB rust severity model</span>
      <span>Built for visual inspection workflows</span>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
